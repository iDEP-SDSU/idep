# ShinyProxy configuration: one container per user session.
#
# Two tiers of app:
#
#   current  /idep/ /go/            webapp:latest, pre-warmed pools, heavy use
#   legacy   everything else        webapp:2026,   cold start, occasional use
#
# Spec ids carry the version (idep250, go86, idep210, ...). /idep/ and /go/
# are aliases in nginx onto whichever spec is current; releasing a new
# version means adding a spec and moving the alias, never editing the old
# spec. See "Moving /idep/ and /go/ to a new version" in README.md.
#
# The legacy tier is pinned to a dated image tag on purpose. Rebuilding
# `webapp:latest` every ~2 years moves R and every Bioconductor package under
# the apps; old iDEP/ShinyGO versions were never tested against those and exist
# precisely so old results stay reproducible. Pinning is what makes that true.
# See "Updating the image" in README.md -- never repoint the legacy anchor at
# :latest.
#
# Bind mounts are written as ${IDEP_ROOT}/...: Spring resolves the placeholder
# from the environment, and idep.sh exports IDEP_ROOT as the repo checkout
# (the parent of this directory) when it launches the JAR. Nothing here
# depends on where the repo lives or who runs it.
#
# nginx (shinyproxy/nginx) terminates :80, serves the static site from
# shinyapps/dist, and maps the friendly paths below onto /app/<id>/.
proxy:
  title: iDEP & ShinyGO
  port: 8080
  authentication: none
  # No navbar: the apps have their own headers, and users should not be
  # offered "Restart app" / "Stop app" controls.
  hide-navbar: true
  # Stock ShinyProxy pages, except app.html, which ./idep.sh regenerates from
  # the JAR on every start with templates/frame-escape.html inserted: an app
  # page loaded inside a frame (a link from one app to another) takes over the
  # tab instead of staying nested. Relative to the working directory, which
  # both idep.sh and the systemd unit set to this directory.
  template-path: ./templates/
  container-backend: docker

  docker:
    url: unix:///var/run/docker.sock
    # ShinyProxy runs on the host, so containers publish a port on the
    # docker bridge and are reached over localhost.
    internal-networking: false

  container-wait-time: 180000     # allow 3 min for a container to become ready
  seat-wait-time: 300000          # how long a user waits for a free seat
  heartbeat-rate: 10000
  heartbeat-timeout: 900000       # reclaim a container 15 min after the tab closes

  # Hard ceiling on concurrent *seats* (i.e. users) across every spec, not
  # containers: the pools below are floors on spare seats and grow past them
  # under load, so this is the only thing that bounds how many R processes
  # can exist. Past it ShinyProxy shows "not enough capacity" instead of
  # OOM-ing the host.
  max-total-instances: 200

  specs:

    # ---------------------------------------------------------------- current
    # Pre-warmed pools on webapp:latest. These two carry essentially all
    # traffic; nginx serves them as /idep/ and /go/ as well as by version.

    - id: idep250
      display-name: iDEP 2.50
      description: Integrated Differential Expression and Pathway analysis
      container-image: webapp:latest
      container-cmd:
        - R
        - -e
        # Sys.setenv first: the image's /usr/local/lib/R/etc/Renviron.site
        # hardcodes a relative IDEP_TELEMETRY_SQLITE and R's Renviron files
        # override the process env, so container-env alone is discarded and
        # telemetry silently falls back to no-op. Drop this once the image
        # stops shipping that line.
        - Sys.setenv(IDEP_TELEMETRY_SQLITE = "/srv/usage/idep_telemetry.sqlite"); options(golem.app.prod = TRUE); idep250::run_app(options = list(host = "0.0.0.0", port = 3838))
      port: 3838
      container-volumes:
        - ${IDEP_ROOT}/data:/srv/data:ro
        - ${IDEP_ROOT}/countsData:/srv/countsData:ro
        - ${IDEP_ROOT}/usage:/srv/usage
      container-env:
        IDEP_DATA_DIR: /srv/data
        IDEP_TELEMETRY_SQLITE: /srv/usage/idep_telemetry.sqlite
      container-memory-limit: 15g
      # Keep spare containers booted so arrivals skip the ~12.5 s cold start
      # (setting minimum-seats-available is what enables pre-initialization).
      # This is a floor on *spare* seats, topped up as users take them, not a
      # cap on users. 6 free seats = 6 idle containers, ~1.7 GB.
      #
      # Sized from the arrival trace, not from peak concurrency: the pool only
      # has to cover the boot of a replacement seat, and iDEP arrivals are ~330
      # a day with a median gap of 147 s. Replaying a day of real claims, 4
      # spare seats already served every arrival warm, and 6 still does with
      # the boot time tripled (which is what a burst of simultaneous boots
      # looks like). The worst burst on record is 8 arrivals in a minute.
      minimum-seats-available: 6
      # One user per container: iDEP sessions are memory-heavy (15 GB cap) and
      # run long single-threaded computations, so sharing an R process would
      # make users block each other and share one OOM fate.
      seats-per-container: 1
      allow-container-re-use: false   # every user gets a fresh R process
      scale-down-delay: 5

    - id: go86
      display-name: ShinyGO 8.6
      description: Enrichment analysis of gene lists
      container-image: webapp:latest
      container-cmd:
        - R
        - -e
        - shiny::runApp("/srv/shiny-server/go86", host = "0.0.0.0", port = 3838)
      port: 3838
      container-volumes:
        - ${IDEP_ROOT}/shinyapps/go86:/srv/shiny-server/go86:ro
        - ${IDEP_ROOT}/data:/srv/data:ro
      container-env:
        IDEP_DATABASE: /srv/data
      container-memory-limit: 15g
      # 8 free seats = 8 idle containers, ~2.2 GB. ShinyGO is the busier of the
      # two (~1050 sessions a day) and burstier -- 17 arrivals in one minute is
      # in the trace -- but it also boots in 6.5 s, so the pool refills faster
      # than a classroom arrives. Replaying a day of real claims, 8 spare seats
      # served every arrival warm; even with the boot time tripled only 0.6%
      # waited, ~11 s each. See the note on idep250 above.
      minimum-seats-available: 8
      # One user per container, as for iDEP: a fresh R process per session
      # means users never block each other or share an OOM. ShinyGO is light
      # enough (~270 MB idle, 6.5 s start) that this costs little.
      seats-per-container: 1
      allow-container-re-use: false   # every user gets a fresh R process
      scale-down-delay: 5

    # ----------------------------------------------------------------- legacy
    # Old versions, kept so published analyses stay reproducible. No
    # minimum-seats-available, so each costs *nothing* until someone opens it:
    # the first visitor waits for a cold container (~4-7 s), and it is reclaimed
    # 15 min after the last tab closes.
    #
    # Every entry below inherits this block via a YAML merge key and overrides
    # only id / display-name / description / container-cmd. To add an app: copy
    # the four lines, point container-cmd at its directory under shinyapps/, and
    # add two lines to nginx/nginx.conf.
    #
    # Why the whole shinyapps tree is mounted rather than one directory: these
    # apps hardcode relative database paths ("../../data/data96/", "../go/") and
    # shiny::runApp() sets the working directory to the app directory, exactly
    # as shiny-server did. With the tree at /srv/shiny-server and the databases
    # at /srv/data, every one of those paths resolves to the same file it did
    # under shiny-server.
    #
    # It is mounted read-only, which shiny-server's was not. An app that writes
    # into its own directory will fail here -- drop the ":ro" if one does.

    - &legacy
      id: idep210
      display-name: iDEP 2.10
      description: Legacy version
      container-image: webapp:2026
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep210", host = "0.0.0.0", port = 3838)']
      port: 3838
      container-volumes:
        - ${IDEP_ROOT}/shinyapps:/srv/shiny-server:ro
        - ${IDEP_ROOT}/data:/srv/data:ro
        - ${IDEP_ROOT}/countsData:/srv/countsData:ro
      # Both names are set on every legacy app: the ShinyGO line reads
      # IDEP_DATABASE, the golem-packaged iDEP line reads IDEP_DATA_DIR, and the
      # pre-golem versions read neither (they hardcode ../../data/dataNNN/).
      # Each app appends its own database version to whichever it uses.
      container-env:
        IDEP_DATABASE: /srv/data
        IDEP_DATA_DIR: /srv/data
      container-memory-limit: 15g
      # One user per container, same as the current tier. This used to say 5,
      # on the theory that legacy users would share an R process as they shared
      # one shiny-server process -- but it never did anything: ShinyProxy only
      # routes a spec through the sharing dispatcher when
      # minimum-seats-available is set, and seats-per-container alone leaves it
      # on the default one-container-per-session path (seatsPerContainer
      # carries a Lombok default, minimumSeatsAvailable does not). Every legacy
      # session in the logs boots its own container, none claim a seat.
      #
      # It matters now that four legacy specs below do set
      # minimum-seats-available: with 5 here they would silently start sharing
      # one R process between five users, on the same 15 GB cap, where one
      # user's OOM takes the other four with it. Keep it 1.
      seats-per-container: 1
      allow-container-re-use: false
      scale-down-delay: 5

    # --- iDEP ---------------------------------------------------------------

    - <<: *legacy
      id: idep20
      display-name: iDEP 2.0
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep20", host = "0.0.0.0", port = 3838)']
      # Warm pool: this is one of the four legacy apps with real traffic
      # (see "Warm pools on the legacy tier" in README.md). ~130 sessions a day, second only to iDEP 2.5;
      # 2 spares served every arrival warm when the day was replayed.
      minimum-seats-available: 2

    - <<: *legacy
      id: idep11
      display-name: iDEP 1.1
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep11", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idep96
      display-name: iDEP 0.96
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep96", host = "0.0.0.0", port = 3838)']
      # Reads IDEP_DATABASE as the full versioned path with a trailing slash,
      # exactly like go76/go77 above: server.R does paste0(datapath,
      # "convertIDs.db") with no separator and no version appended, so the
      # inherited /srv/data yields "/srv/dataconvertIDs.db" and every session
      # dies on "unable to open database file". 0.95 and older hardcode the
      # path and are unaffected; 0.96 is the only iDEP version that reads the
      # variable. data104b is what the fallback in server.R points at, and
      # what shiny-server served, since it left IDEP_DATABASE unset.
      # This map replaces the anchor's, so IDEP_DATA_DIR is repeated.
      container-env:
        IDEP_DATABASE: /srv/data/data104b/
        IDEP_DATA_DIR: /srv/data
      # Warm pool: this is one of the four legacy apps with real traffic
      # (see "Warm pools on the legacy tier" in README.md). ~72 sessions a day.
      # The replay puts its cold-start rate higher than the others, but that is
      # one client that opened 15 sessions in 90 s on 2026-09-06, not 15
      # people; the rest of its traffic is smooth and 2 spares cover it.
      minimum-seats-available: 2

    - <<: *legacy
      id: idep95
      display-name: iDEP 0.95
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep95", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idep94
      display-name: iDEP 0.94
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep94", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idep93
      display-name: iDEP 0.93
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep93", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idep92
      display-name: iDEP 0.92
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep92", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idep90
      display-name: iDEP 0.90
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep90", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idep85
      display-name: iDEP 0.85
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep85", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idep82
      display-name: iDEP 0.82
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep82", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idep73
      display-name: iDEP 0.73
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep73", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idepg
      display-name: iDEP Golem
      description: Development build
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idepgolem1", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: idepc
      display-name: iDEP custom
      description: Custom database build
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/idep-custom", host = "0.0.0.0", port = 3838)']

    # --- ShinyGO ------------------------------------------------------------

    - <<: *legacy
      id: go85
      display-name: ShinyGO 0.85
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go85", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go82
      display-name: ShinyGO 0.82
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go82", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go81
      display-name: ShinyGO 0.81
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go81", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go80
      display-name: ShinyGO 0.80
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go80", host = "0.0.0.0", port = 3838)']
      # Warm pool: this is one of the four legacy apps with real traffic
      # (see "Warm pools on the legacy tier" in README.md). ~42 sessions a day; 1 spare already served every
      # arrival warm, 1 is the whole pool.
      minimum-seats-available: 1

    - <<: *legacy
      id: go77
      display-name: ShinyGO 0.77
      # Directory is "go", not "go77" -- the shinygo submodule.
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go", host = "0.0.0.0", port = 3838)']
      # 0.76 and 0.77 are the transitional pair: they read IDEP_DATABASE like
      # 0.80+ but, unlike them, neither appends a separator nor a database
      # version -- global.R does paste0(datapath, "convertIDs.db") directly.
      # So the value has to be the full versioned path *with* a trailing
      # slash; the inherited /srv/data yields "/srv/dataconvertIDs.db" and the
      # app exits with "unable to open database file". data104b is what both
      # hardcoded before the switch to the variable (shinygo 2734f42).
      # This map replaces the anchor's, so IDEP_DATA_DIR is repeated.
      container-env:
        IDEP_DATABASE: /srv/data/data104b/
        IDEP_DATA_DIR: /srv/data
      # Warm pool: this is one of the four legacy apps with real traffic
      # (see "Warm pools on the legacy tier" in README.md). ~82 sessions a day from 21 distinct IPs in a
      # single nginx window; 2 spares served every arrival warm.
      minimum-seats-available: 2

    - <<: *legacy
      id: go76
      display-name: ShinyGO 0.76
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go76", host = "0.0.0.0", port = 3838)']
      # Full versioned path with a trailing slash, as for go77 above.
      container-env:
        IDEP_DATABASE: /srv/data/data104b/
        IDEP_DATA_DIR: /srv/data

    - <<: *legacy
      id: go75
      display-name: ShinyGO 0.75
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go75", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go74
      display-name: ShinyGO 0.74
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go74", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go65
      display-name: ShinyGO 0.65
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go65", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go61
      display-name: ShinyGO 0.61
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go61", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go60
      display-name: ShinyGO 0.60
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go60", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go51
      display-name: ShinyGO 0.51
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go51", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go50
      display-name: ShinyGO 0.50
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go50", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go41
      display-name: ShinyGO 0.41
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go41", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: goc
      display-name: ShinyGO custom
      description: Custom database build
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go-custom", host = "0.0.0.0", port = 3838)']

    # --- utilities ----------------------------------------------------------

    - <<: *legacy
      id: datamap
      display-name: Data map
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/datamap", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: reads
      display-name: Read counts
      description: Pre-processed RNA-seq counts from ARCHS4 and DEE2
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/reads", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: go2gmt
      display-name: GO to GMT
      description: Export GO annotation as gene sets
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/go2gmt", host = "0.0.0.0", port = 3838)']

    - <<: *legacy
      id: combine
      display-name: Combine files
      description: Extract and combine read-count or FPKM files
      container-cmd: [R, -e, 'shiny::runApp("/srv/shiny-server/combine", host = "0.0.0.0", port = 3838)']

logging:
  file:
    name: shinyproxy.log

server:
  # Loopback only: nginx on :443 is the only way in. Without this the JAR
  # listens on every interface, so anything not blocked by a firewall could
  # reach ShinyProxy (and the actuator below) directly.
  address: 127.0.0.1
  # nginx sets X-Forwarded-*; trust it so generated URLs use the public host.
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 3600

management:
  server:
    # The actuator (/actuator/health, /actuator/recyclable) is on :9090.
    address: 127.0.0.1
