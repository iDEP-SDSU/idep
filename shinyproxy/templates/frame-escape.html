        <!-- Inserted into ShinyProxy's stock app.html by ./idep.sh (render_templates). -->
        <script>
            // Take over the tab when this page is loaded inside a frame.
            //
            // ShinyProxy shows every app inside an <iframe> on this page. A
            // link from one app to another without target="_blank" -- iDEP's
            // "old versions are still usable", the legacy apps' "try the new
            // version" -- navigates that iframe, so the second app loads
            // nested inside the first one's page: the address bar keeps the
            // first URL, the first container keeps its seat because its
            // heartbeat never stops, and a reload brings the first app back.
            //
            // Same-origin only in practice. Chrome refuses a cross-origin
            // frame's attempt to navigate the top window unless *this*
            // document has a user gesture, and the click that brought us here
            // happened in the previous document ("Unsafe attempt to initiate
            // navigation ... nor has it received a user gesture"). So a link
            // to another host stays nested; the app's own target="_blank" is
            // the only fix for that. Plain assignment (not replace) keeps the
            // first app in history, so Back returns to it and ShinyProxy
            // resumes that session.
            if (window.top !== window.self) {
                window.top.location.href = window.location.href;
            }
        </script>
