# Front end for the ShinyProxy stack.
#
# Runs with --network host, so it binds :80 and reaches ShinyProxy on
# 127.0.0.1:8080 directly.
#
# Three jobs:
#   1. serve the static site (shinyapps/dist) at /            -- was shiny-server's site_dir
#   2. serve the shared database downloads at /data/          -- was nginx's autoindex
#   3. map each friendly path onto ShinyProxy's /app/<id>/    -- was shiny-server's locations
#
# ShinyProxy has no per-app URL setting (its `target-path` is the path *inside*
# the container), which is why the mapping lives here.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream shinyproxy {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen      80 default_server;
        listen [::]:80 default_server;
        server_name _;

        client_max_body_size 1024m;

        # Shiny keeps a websocket open for the life of the session, and an
        # analysis can run for many minutes without sending anything.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;

        # ------------------------------------------------------------ current
        location = /idep    { return 301 /idep/; }
        location = /idep250 { return 301 /idep250/; }
        location = /go      { return 301 /go/; }
        location = /go86    { return 301 /go86/; }

        location /idep/    { proxy_pass http://shinyproxy/app/idep/; }
        location /idep250/ { proxy_pass http://shinyproxy/app/idep/; }
        location /go/      { proxy_pass http://shinyproxy/app/go/; }
        location /go86/    { proxy_pass http://shinyproxy/app/go/; }

        # ------------------------------------------------------------- legacy
        # One redirect + one proxy_pass per app, matching the ids in
        # application.yml. The paths are the ones shiny-server published, so
        # existing bookmarks and links in published papers keep working.
        location = /idep210 { return 301 /idep210/; }
        location = /idep20  { return 301 /idep20/; }
        location = /idep11  { return 301 /idep11/; }
        location = /idep96  { return 301 /idep96/; }
        location = /idep95  { return 301 /idep95/; }
        location = /idep94  { return 301 /idep94/; }
        location = /idep93  { return 301 /idep93/; }
        location = /idep92  { return 301 /idep92/; }
        location = /idep90  { return 301 /idep90/; }
        location = /idep85  { return 301 /idep85/; }
        location = /idep82  { return 301 /idep82/; }
        location = /idep73  { return 301 /idep73/; }
        location = /idepg   { return 301 /idepg/; }
        location = /idepc   { return 301 /idepc/; }

        location /idep210/ { proxy_pass http://shinyproxy/app/idep210/; }
        location /idep20/  { proxy_pass http://shinyproxy/app/idep20/; }
        location /idep11/  { proxy_pass http://shinyproxy/app/idep11/; }
        location /idep96/  { proxy_pass http://shinyproxy/app/idep96/; }
        location /idep95/  { proxy_pass http://shinyproxy/app/idep95/; }
        location /idep94/  { proxy_pass http://shinyproxy/app/idep94/; }
        location /idep93/  { proxy_pass http://shinyproxy/app/idep93/; }
        location /idep92/  { proxy_pass http://shinyproxy/app/idep92/; }
        location /idep90/  { proxy_pass http://shinyproxy/app/idep90/; }
        location /idep85/  { proxy_pass http://shinyproxy/app/idep85/; }
        location /idep82/  { proxy_pass http://shinyproxy/app/idep82/; }
        location /idep73/  { proxy_pass http://shinyproxy/app/idep73/; }
        location /idepg/   { proxy_pass http://shinyproxy/app/idepg/; }
        location /idepc/   { proxy_pass http://shinyproxy/app/idepc/; }

        location = /go85 { return 301 /go85/; }
        location = /go82 { return 301 /go82/; }
        location = /go81 { return 301 /go81/; }
        location = /go80 { return 301 /go80/; }
        location = /go77 { return 301 /go77/; }
        location = /go76 { return 301 /go76/; }
        location = /go75 { return 301 /go75/; }
        location = /go74 { return 301 /go74/; }
        location = /go65 { return 301 /go65/; }
        location = /go61 { return 301 /go61/; }
        location = /go60 { return 301 /go60/; }
        location = /go51 { return 301 /go51/; }
        location = /go50 { return 301 /go50/; }
        location = /go41 { return 301 /go41/; }
        location = /goc  { return 301 /goc/; }

        location /go85/ { proxy_pass http://shinyproxy/app/go85/; }
        location /go82/ { proxy_pass http://shinyproxy/app/go82/; }
        location /go81/ { proxy_pass http://shinyproxy/app/go81/; }
        location /go80/ { proxy_pass http://shinyproxy/app/go80/; }
        location /go77/ { proxy_pass http://shinyproxy/app/go77/; }
        location /go76/ { proxy_pass http://shinyproxy/app/go76/; }
        location /go75/ { proxy_pass http://shinyproxy/app/go75/; }
        location /go74/ { proxy_pass http://shinyproxy/app/go74/; }
        location /go65/ { proxy_pass http://shinyproxy/app/go65/; }
        location /go61/ { proxy_pass http://shinyproxy/app/go61/; }
        location /go60/ { proxy_pass http://shinyproxy/app/go60/; }
        location /go51/ { proxy_pass http://shinyproxy/app/go51/; }
        location /go50/ { proxy_pass http://shinyproxy/app/go50/; }
        location /go41/ { proxy_pass http://shinyproxy/app/go41/; }
        location /goc/  { proxy_pass http://shinyproxy/app/goc/; }

        location = /datamap { return 301 /datamap/; }
        location = /reads   { return 301 /reads/; }
        location = /go2gmt  { return 301 /go2gmt/; }
        location = /combine { return 301 /combine/; }

        location /datamap/ { proxy_pass http://shinyproxy/app/datamap/; }
        location /reads/   { proxy_pass http://shinyproxy/app/reads/; }
        location /go2gmt/  { proxy_pass http://shinyproxy/app/go2gmt/; }
        location /combine/ { proxy_pass http://shinyproxy/app/combine/; }

        # -------------------------------------------------------------- /data
        # Database downloads. go86 and the golem iDEP versions fetch missing
        # species databases from http://<host>/data/ at runtime.
        location /data/ {
            alias /srv/shared/;
            autoindex on;
        }

        # ---------------------------------------------- static site + fallback
        # The Nuxt site in shinyapps/dist is served straight off disk, as
        # shiny-server's `site_dir` used to. Anything with no matching file --
        # ShinyProxy's own /app_proxy/, /api/, /js/, /css/, /webjars/, all of
        # which live inside the JAR, never on disk -- falls through to
        # ShinyProxy. That way the asset paths the app pages reference at the
        # root keep working without having to enumerate them here.
        root  /srv/dist;
        index index.html;

        location / {
            try_files $uri $uri/ $uri.html @shinyproxy;
        }

        location @shinyproxy {
            proxy_pass http://shinyproxy;
        }
    }
}
