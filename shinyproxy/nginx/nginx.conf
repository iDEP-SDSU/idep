# Front end for the ShinyProxy test stack.
# Runs with --network host, so it binds :80 and reaches ShinyProxy on
# 127.0.0.1:8080 directly.
worker_processes auto;

events {
    worker_connections 4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream shinyproxy {
        server 127.0.0.1:8080;
        keepalive 32;
    }

    server {
        listen      80 default_server;
        listen [::]:80 default_server;
        server_name _;

        client_max_body_size 1024m;

        # Shiny keeps a websocket open for the life of the session, and an
        # analysis can run for many minutes without sending anything.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;

        # Friendly URLs: /idep/ -> the "idep" spec, /go/ -> the "go" spec.
        location = /idep { return 301 /idep/; }
        location = /go   { return 301 /go/; }

        location /idep/ {
            proxy_pass http://shinyproxy/app/idep/;
        }

        location /go/ {
            proxy_pass http://shinyproxy/app/go/;
        }

        # Everything else (/app_proxy/, /api/, /js/, /css/, the app list) goes
        # to ShinyProxy untouched -- the pages above reference these at the root.
        location / {
            proxy_pass http://shinyproxy;
        }
    }
}
