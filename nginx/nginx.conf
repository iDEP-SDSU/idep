worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream app_servers {
        # Shared upstream state between nginx worker processes
        zone app_servers 256k;

        # Only used for a browser that does not yet have
        # a shiny_backend affinity cookie
        least_conn;

        # Sticky session cookie for HTTP test server.
        # IMPORTANT: no "secure" flag here.
        sticky cookie shiny_backend
            httponly
            samesite=lax
            path=/;

        server idep-webapp-1:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-2:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-3:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-4:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-5:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-6:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-7:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-8:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-9:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-10:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-11:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-12:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-13:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-14:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-15:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-16:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-17:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-18:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-19:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-20:3838 fail_timeout=2s max_fails=1;
    }

    server {
        listen 80;
        listen [::]:80;

        server_name bioinformatics.sdstate.edu;

        client_max_body_size 200m;

        add_header Content-Security-Policy-Report-Only
            "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
            always;

        keepalive_timeout 300;
        proxy_read_timeout 300;

        location / {
            proxy_pass http://app_servers;

            proxy_http_version 1.1;

            # Shiny / WebSocket support
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;

            proxy_connect_timeout 2s;

            # Keep your existing retry behavior for this first test
            proxy_next_upstream
                error
                timeout
                http_502
                http_503
                http_504;

            proxy_next_upstream_timeout 2s;
            proxy_next_upstream_tries 2;

            # Keep existing buffering behavior unchanged
            proxy_buffering on;
        }

        location /data {
            root /;
            autoindex on;
        }
    }
}