worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;

    #
    # Correct WebSocket Connection header handling
    #
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    #
    # Logging for Shiny upstream behavior
    #
    # sticky                  = nginx affinity cookie
    # upstream                = actual Shiny container/IP nginx selected
    # request_time            = total request duration
    # upstream_connect_time   = time to establish connection to Shiny
    # upstream_header_time    = time until Shiny returned response headers
    # upstream_response_time  = complete upstream response time
    #
    log_format shiny_upstream
        '$remote_addr '
        '- "$request" '
        'status=$status '
        'sticky=$cookie_shiny_backend '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_connect_time=$upstream_connect_time '
        'upstream_header_time=$upstream_header_time '
        'upstream_response_time=$upstream_response_time';

    upstream app_servers {
        #
        # Shared runtime state between nginx workers.
        #
        zone app_servers 256k;

        #
        # Initial assignment of a browser that does not yet
        # have a shiny_backend cookie.
        #
        # Uses response-header latency + active connections,
        # including requests currently in flight.
        #
        least_time header inflight;

        #
        # Once a browser is assigned to a Shiny container,
        # keep all of its requests on that container.
        #
        # Production uses HTTPS, so Secure is enabled.
        #
        # No expires= means this is a browser-session cookie.
        #
        sticky cookie shiny_backend
            httponly
            #secure
            samesite=lax
            path=/;

        server idep-webapp-1:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-2:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-3:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-4:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-5:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-6:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-7:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-8:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-9:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-10:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-11:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-12:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-13:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-14:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-15:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-16:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-17:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-18:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-19:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-20:3838 fail_timeout=2s max_fails=1;
    }

    server {
        listen 80;

        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        server_name bioinformatics.sdstate.edu;

        client_max_body_size 200m;

        add_header Content-Security-Policy-Report-Only
            "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
            always;

        add_header Strict-Transport-Security
            "max-age=31536000"
            always;

        keepalive_timeout 300;
        proxy_read_timeout 300;

        ssl_certificate     /etc/pki/nginx/server.pem;
        ssl_certificate_key /etc/pki/nginx/private/server.key;

        ssl_protocols TLSv1.2;

        ssl_ciphers
            ECDHE-ECDSA-AES128-GCM-SHA256:
            ECDHE-RSA-AES128-GCM-SHA256:
            ECDHE-ECDSA-AES256-GCM-SHA384:
            ECDHE-RSA-AES256-GCM-SHA384:
            ECDHE-ECDSA-CHACHA20-POLY1305:
            ECDHE-RSA-CHACHA20-POLY1305:
            DHE-RSA-AES128-GCM-SHA256:
            DHE-RSA-AES256-GCM-SHA384;

        location / {
            proxy_pass http://app_servers;

            proxy_http_version 1.1;

            #
            # Shiny / WebSocket support
            #
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;

            proxy_connect_timeout 2s;

            #
            # Keep your existing retry behavior unchanged
            # during this production rollout.
            #
            proxy_next_upstream
                error
                timeout
                http_502
                http_503
                http_504;

            proxy_next_upstream_timeout 2s;
            proxy_next_upstream_tries 2;

            #
            # Keep existing buffering behavior unchanged.
            #
            proxy_buffering on;

            #
            # Dedicated Shiny/load-balancer log.
            #
            access_log /var/log/nginx/shiny_access.log shiny_upstream;
        }

        location /data {
            root /;
            autoindex on;
        }
    }
}