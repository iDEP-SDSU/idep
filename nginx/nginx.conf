worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 5m;

    #
    # WebSocket handling for Shiny
    #
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    #
    # Log upstream/container behavior
    #
    log_format shiny_upstream
        '$remote_addr '
        '- "$request" '
        'status=$status '
        'sticky=$cookie_shiny_backend '
        'upstream=$upstream_addr '
        'upstream_status=$upstream_status '
        'request_time=$request_time '
        'upstream_connect_time=$upstream_connect_time '
        'upstream_header_time=$upstream_header_time '
        'upstream_response_time=$upstream_response_time';

    #
    # Shiny Server containers
    #
    upstream app_servers {

        #
        # Share upstream connection state between nginx workers
        #
        zone app_servers 256k;

        #
        # Select the backend with the fewest active connections
        # for a browser that does not already have a sticky cookie.
        #
        least_conn;

        #
        # Keep each browser pinned to its selected Shiny container.
        #
        sticky cookie shiny_backend
            httponly
            secure
            samesite=lax
            path=/;

        server idep-webapp-1:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-2:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-3:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-4:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-5:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-6:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-7:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-8:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-9:3838  fail_timeout=2s max_fails=1;
        server idep-webapp-10:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-11:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-12:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-13:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-14:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-15:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-16:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-17:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-18:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-19:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-20:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-21:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-22:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-23:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-24:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-25:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-26:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-27:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-28:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-29:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-30:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-31:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-32:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-33:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-34:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-35:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-36:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-37:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-38:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-39:3838 fail_timeout=2s max_fails=1;
        server idep-webapp-40:3838 fail_timeout=2s max_fails=1;
    }

    #
    # HTTP -> HTTPS only
    #
    server {
        listen 80;
        listen [::]:80;

        server_name bioinformatics.sdstate.edu;

        return 301 https://$host$request_uri;
    }

    #
    # HTTPS Shiny server
    #
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;

        server_name bioinformatics.sdstate.edu;

        client_max_body_size 200m;

        add_header Content-Security-Policy-Report-Only
            "default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
            always;

        add_header Strict-Transport-Security
            "max-age=31536000"
            always;

        keepalive_timeout 300;
        proxy_read_timeout 300;

        ssl_certificate     /etc/pki/nginx/server.pem;
        ssl_certificate_key /etc/pki/nginx/private/server.key;

        ssl_protocols TLSv1.2;

        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        #
        # Shiny applications
        #
        location / {
            proxy_pass http://app_servers;

            proxy_http_version 1.1;

            #
            # WebSocket support
            #
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_redirect off;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;

            proxy_connect_timeout 2s;

            #
            # Keep existing retry behavior for now
            #
            proxy_next_upstream
                error
                timeout
                http_502
                http_503
                http_504;

            proxy_next_upstream_timeout 2s;
            proxy_next_upstream_tries 2;

            #
            # Keep your existing buffering behavior unchanged
            #
            proxy_buffering on;

            #
            # Dedicated Shiny load-balancer log
            #
            access_log /var/log/nginx/shiny_access.log shiny_upstream;
        }

        #
        # Existing static data location
        #
        location /data {
            root /;
            autoindex on;
        }
    }
}